<script>
/* 设备版与轮播游标都在树莓派上（moreaix.com），GitHub Pages 只发完整版 feed.xml。
   跨域读是允许的：Pi 的 serve.py 对所有响应都带 access-control-allow-origin: *。
   两个数据源（全天缓存视图二者按 link 去重合并，保证含当前条目）：
     · feed.xml      —— 每 5 分钟重建，去重后最新 120 条（任意主机都有）。
     · ai-accum.json —— 当日滚动池（tmpfs，本地零点重置，默认不限 AI_ACCUM_CAP=0），
                       由 rss-build 每 5 分钟并入、按标题去重累积；GitHub Pages 镜像没有，
                       此时全天缓存降级显示当前 feed 的 120 条并提示回 moreaix.com。 */

const STATE_URL  = 'https://moreaix.com/rss/rotate.json';

let CURRENT_VIEW = 'feed';   // 'feed' | 'accum'
let ALL_ITEMS = [];          // 当前视图的原始条目，供搜索筛选复用，不重复请求

// 看板式自动滚动：单列信息流，整份渲染后做无缝循环（内容不多时整屏装得下，不滚）
const board = document.getElementById('board');
const track = document.getElementById('track');
const empty = document.getElementById('empty');
let filtered = [];
let copyH = 0;            // 一份内容的高度（track 里渲染了两份用于无缝循环）
let autoPos = 0;          // 虚拟滚动偏移
let hovering = false;     // 鼠标悬停暂停
let userPaused = false;   // 手动暂停
let interactUntil = 0;    // 手动滚动后暂停到的时刻
const SCROLL_SPEED = 0.5; // px/帧（≈30px/s，舒适阅读速度）

// 逐条建 DOM，不拼 innerHTML：标题/链接/源名来自第三方 RSS，拼串等于给任意源站
// 在本页执行脚本的机会；链接只认 http(s)。（沿用原安全策略）
function makeRow(it){
  const art = document.createElement('article');
  art.className = 'row';
  const top = document.createElement('div');
  top.className = 'row-top';
  const src = (it.source || '').trim();
  const tag = document.createElement('span');
  tag.className = 'tag';
  tag.textContent = src || '未知来源';
  const time = document.createElement('span');
  time.className = 'time';
  time.textContent = fmt(it.date);
  top.appendChild(tag);
  top.appendChild(time);
  art.appendChild(top);
  const a = document.createElement('a');
  a.className = 'title';
  a.textContent = it.title || '(无标题)';
  if(/^https?:\/\//i.test(it.link)){
    a.href = it.link; a.target = '_blank'; a.rel = 'noopener noreferrer';
  }
  art.appendChild(a);
  if(it.desc){
    const p = document.createElement('p');
    p.className = 'excerpt';
    p.textContent = it.desc;
    art.appendChild(p);
  }
  return art;
}

function fmt(d){
  if(!d) return '';
  const now = Date.now(), ts = d.getTime(), min = Math.round((now-ts)/60000);
  if(min < 1) return '刚刚';
  if(min < 60) return min + ' 分钟前';
  if(min < 1440) return Math.round(min/60) + ' 小时前';
  return (d.getMonth()+1) + '/' + d.getDate();
}

// （卡片工厂已改为 makeRow，见上方自动滚动段）

function render(preserve){
  const q = (document.getElementById('q').value || '').trim().toLowerCase();
  filtered = q
    ? ALL_ITEMS.filter(it =>
        (it.title||'').toLowerCase().includes(q) || (it.source||'').toLowerCase().includes(q))
    : ALL_ITEMS;
  if(!filtered.length){
    empty.hidden = false;
    empty.textContent = q ? '没有匹配的条目' : '暂无条目';
    track.replaceChildren();
    copyH = 0;
    return;
  }
  empty.hidden = true;
  const frag = document.createDocumentFragment();
  filtered.forEach(it => frag.appendChild(makeRow(it)));   // 第一份
  filtered.forEach(it => frag.appendChild(makeRow(it)));   // 第二份：无缝循环用
  track.replaceChildren(frag);
  if(preserve){
    // 后台刷新：保持当前滚动位置连续，不跳回顶部
    requestAnimationFrame(() => {
      copyH = track.scrollHeight / 2;
      if(copyH > 0 && autoPos > copyH) autoPos = copyH;
      board.scrollTop = autoPos;
    });
  } else {
    autoPos = 0;
    board.scrollTop = 0;
    requestAnimationFrame(() => { copyH = track.scrollHeight / 2; });
  }
}

function parseDate(s){
  if(!s) return null;
  const d = new Date(s);
  return d && !isNaN(d) ? d : null;
}

// 视图一：feed.xml（RSS 2.0，字段 title/link/source/description/pubDate）
function parseFeed(txt, preserve){
  const doc = new DOMParser().parseFromString(txt, 'text/xml');
  const items = [...doc.querySelectorAll('item')];
  const lb = doc.querySelector('lastBuildDate')?.textContent;
  const lbd = parseDate(lb);
  ALL_ITEMS = items.map(it => ({
    title: it.querySelector('title')?.textContent || '',
    link:  (it.querySelector('link')?.textContent || '').trim(),
    source:(it.querySelector('source')?.textContent || '').trim(),
    desc:  (it.querySelector('description')?.textContent || '').trim(),
    date:  parseDate(it.querySelector('pubDate')?.textContent)
  }));
  setFeedStats(ALL_ITEMS.length, lbd && !isNaN(lbd) ? fmt(lbd) : '—');
  render(preserve);
}

// 视图二：全天缓存 = ai-accum.json（当天见过的全部）+ 当前 feed.xml（保证含最新条目）
// 两份按 link 去重合并，feed 里不在池中的当前条目一定会出现 —— 「全天 = 所有」。
function toItem(it){
  return {
    title: it.title || '',
    link:  (it.link || '').trim(),
    source:(it.source || '').trim() || '未知来源',
    desc:  (it.summary || '').trim(),
    date:  parseDate(it.date_raw)
  };
}
function loadAccum(preserve){
  const t = Date.now();
  Promise.all([
    fetch('./ai-accum.json?t=' + t, {cache:'no-store'}).then(r => r.ok ? r.json() : null),
    fetch('./feed.xml?t=' + t, {cache:'no-store'}).then(r => r.ok ? r.text() : null)
  ]).then(([acc, feedTxt]) => {
    let items = (acc && Array.isArray(acc.items)) ? acc.items.map(toItem) : [];
    const have = new Set(items.map(i => i.link));
    let fromFeed = 0;
    if (feedTxt){
      const doc = new DOMParser().parseFromString(feedTxt, 'text/xml');
      doc.querySelectorAll('item').forEach(it => {
        const link = (it.querySelector('link')?.textContent || '').trim();
        if (!link || have.has(link)) return;
        items.push({
          title: it.querySelector('title')?.textContent || '',
          link: link,
          source: (it.querySelector('source')?.textContent || '').trim() || '未知来源',
          desc: (it.querySelector('description')?.textContent || '').trim(),
          date: parseDate(it.querySelector('pubDate')?.textContent)
        });
        have.add(link);
        fromFeed++;
      });
    }
    items.sort((a, b) => (b.date?.getTime() || 0) - (a.date?.getTime() || 0));
    ALL_ITEMS = items;
    setAccumStats(items.length, (acc && acc.date) ? acc.date : '—', fromFeed, !acc);
    render(preserve);
  }).catch(() => showError('全天缓存载入失败，请稍后重试或切到「最新头条」。'));
}

function setFeedStats(n, t){
  document.getElementById('n').textContent = n;
  document.getElementById('t').textContent = t;
  document.getElementById('nL').textContent = '当前条目';
  document.getElementById('tL').textContent = '最后构建';
}
function setAccumStats(n, date, fromFeed, isMirror){
  document.getElementById('n').textContent = n;
  document.getElementById('t').textContent = date;
  document.getElementById('nL').textContent = '全天条目';
  document.getElementById('tL').textContent = '缓存日期';
  document.getElementById('accN').textContent = n ? '(' + n + ')' : '';
  const note = document.getElementById('accNote');
  if (isMirror){
    note.textContent = 'GitHub Pages 镜像没有全天缓存文件，这里显示当前 ' + n
      + ' 条；完整「全天所有」请在 moreaix.com/rss/reader.html 查看。';
  } else if (fromFeed > 0){
    note.textContent = '已并入当前 feed 的 ' + fromFeed + ' 条最新条目，确保含当下头条。';
  } else {
    note.textContent = '';
  }
}

function showError(msg){
  empty.hidden = false;
  empty.textContent = msg;   // 纯静态文案，无第三方内容
  track.replaceChildren();
  copyH = 0;
}

function loadView(preserve, interactive){
  interactive = interactive !== false;   // 后台自动刷新不闪按钮
  const rf = document.getElementById('refresh');
  if(interactive && rf){ rf.disabled = true; rf.textContent = '刷新中…'; }
  const done = () => { if(interactive && rf){ rf.disabled = false; rf.textContent = '刷新'; } };
  if(CURRENT_VIEW === 'accum'){
    // loadAccum 内部已 .catch 处理错误与渲染，这里只负责复位刷新按钮
    Promise.resolve(loadAccum(preserve)).finally(done);
    return;
  }
  fetch('./feed.xml?t=' + Date.now(), {cache:'no-store'})
    .then(r => {
      if(!r.ok) throw new Error('HTTP ' + r.status);
      return r.text();
    })
    .then(t => parseFeed(t, preserve))
    .catch(e => showError('feed 载入失败：' + e.message))
    .finally(done);
}

function switchView(v){
  if(v === CURRENT_VIEW) return;
  CURRENT_VIEW = v;
  document.getElementById('tab-feed').classList.toggle('active', v === 'feed');
  document.getElementById('tab-accum').classList.toggle('active', v === 'accum');
  document.getElementById('lede').textContent = v === 'feed'
    ? '62 个源合并 · 每源 5 条、去重后取最新 120 条 · 设备版由树莓派每 5 分钟换一条、优先播最新。下方为网页阅读版，可直接点标题跳原文。'
    : '当天见过的全部 RSS 条目（本地零点重置）· 由 rss-build 每 5 分钟并入、按标题去重；已并入当前 feed 确保含当下头条；点标题跳原文，可搜索筛选。';
  loadView();
}

// 设备版轮播状态（与订阅页同一数据源，两个视图共用）
fetch(STATE_URL + '?t=' + Date.now(), {cache:'no-store'})
  .then(r => r.json())
  .then(st => {
    let back = st.back;
    if (back == null && st.lag != null) back = st.lag;   // 兼容升级途中残留的 1.6.x 状态
    document.getElementById('r').textContent =
      (back == null) ? '—'
        : (back <= 1 ? '实时（' + (st.at || '未知时间') + '）'
                     : '落后 ' + back + ' 条（屏上是 ' + (st.at || '未知时间') + ' 的）');
  })
  .catch(() => {});

document.getElementById('q').addEventListener('input', () => render(false));

// 自动滚动：内容比视口高才滚；鼠标悬停 / 手动滚动 / 手动暂停都停，松开或超时后继续。
function togglePause(){
  userPaused = !userPaused;
  const b = document.getElementById('pause');
  b.textContent = userPaused ? '▶ 继续' : '⏸ 暂停';
}
function tick(){
  const now = Date.now();
  const paused = hovering || userPaused || now < interactUntil;
  const viewH = board.clientHeight;
  if(copyH > viewH && !paused){
    autoPos += SCROLL_SPEED;
    if(autoPos >= copyH) autoPos -= copyH;   // 越过一份就回卷，第二份保证无跳变
    board.scrollTop = autoPos;
  } else {
    autoPos = board.scrollTop;               // 暂停时跟手，不抢滚动条
  }
  requestAnimationFrame(tick);
}
// 自动滚动自身改 scrollTop 也会触发 scroll 事件，用偏移差分辨：差 <2px 即自动，否则是用户
board.addEventListener('scroll', () => {
  if(Math.abs(board.scrollTop - autoPos) < 2) return;
  interactUntil = Date.now() + 4000;         // 用户手动滚动后暂停 4 秒
  autoPos = board.scrollTop;
});
board.addEventListener('mouseenter', () => { hovering = true; });
board.addEventListener('mouseleave', () => { hovering = false; });
board.addEventListener('wheel', () => { interactUntil = Date.now() + 4000; autoPos = board.scrollTop; }, {passive:true});
board.addEventListener('touchmove', () => { interactUntil = Date.now() + 4000; autoPos = board.scrollTop; }, {passive:true});
// 视口尺寸变化后重量一份高度（单列无需重算列数）
let resizeT;
window.addEventListener('resize', () => {
  clearTimeout(resizeT);
  resizeT = setTimeout(() => { if(filtered.length) copyH = track.scrollHeight / 2; }, 120);
});

loadView();
// 与设备版节拍对齐：每 5 分钟回填一次，保持滚动连续（不回顶），避免停留页面时数据陈旧
setInterval(() => loadView(true, false), 300000);
tick();
</script>
</body>
</html>
