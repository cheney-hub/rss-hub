<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>墨水屏预览 · RSS 聚合头条</title>
<style>
  :root{
    --bg:#f2f3f5; --fg:#1b1f24; --sub:#5f6b7a; --card:#fff;
    --line:#dcdfe4; --btn:#1b1f24; --btn-fg:#fff;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#0f1216; --fg:#e8eaed; --sub:#9aa4b2; --card:#171b21;
           --line:#262c35; --btn:#e8eaed; --btn-fg:#12161b; }
  }
  *{box-sizing:border-box}
  body{margin:0;padding:28px 16px 56px;background:var(--bg);color:var(--fg);
       font:15px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
  .wrap{max-width:560px;margin:0 auto}
  h1{font-size:22px;margin:0 0 4px}
  .sub{color:var(--sub);font-size:13px;margin:0 0 26px}
  .stage{display:flex;justify-content:center;height:170px}
  .stage.z2{height:330px}

  /* ---------- 设备本体：全部尺寸按 296×152 像素写死 ---------- */
  .device{width:296px;height:152px;padding:8px;background:#fff;color:#000;
          border-radius:7px;overflow:hidden;display:flex;flex-direction:column;
          box-shadow:0 0 0 1px #b9bec6, 0 12px 30px rgba(0,0,0,.20);
          transform-origin:center top;cursor:pointer;user-select:none;
          font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
  .stage.z2 .device{transform:scale(2)}
  .bar{display:flex;justify-content:space-between;align-items:baseline;
       font-size:8px;font-weight:700;letter-spacing:.4px;
       line-height:11px;padding-bottom:2px;border-bottom:1px solid #000}
  .bar .pg{font-weight:400;opacity:.7}
  .list{flex:1;display:flex;flex-direction:column;overflow:hidden}
  .it{height:30px;padding-top:5px;overflow:hidden}
  .it .t{font-size:11px;line-height:14px;white-space:nowrap;overflow:hidden;
         text-overflow:ellipsis}
  .it .m{font-size:8px;line-height:9px;margin-top:2px;white-space:nowrap;
         overflow:hidden;text-overflow:ellipsis;opacity:.62}
  .it .m i{font-style:normal;opacity:.75}

  /* ---------- 屏幕外的操作区 ---------- */
  .ctrl{display:flex;gap:8px;justify-content:center;align-items:center;
        margin:6px 0 4px;flex-wrap:wrap}
  .ctrl button{border:1px solid var(--line);background:var(--card);color:var(--fg);
               border-radius:9px;padding:7px 13px;font-size:13px;cursor:pointer}
  .ctrl button:active{opacity:.8}
  .ctrl .num{color:var(--sub);font-size:13px;min-width:52px;text-align:center}
  .specs{color:var(--sub);font-size:12px;text-align:center;margin-top:18px;line-height:1.9}
  .specs code{font-size:11px}
  .foot{color:var(--sub);font-size:12px;text-align:center;margin-top:26px}
  .foot a{color:var(--sub)}
</style>
</head>
<body>
<div class="wrap">
  <h1>墨水屏预览</h1>
  <p class="sub">按 Dot Quote/0 的 296 × 152 像素屏排版：一屏 4 条，标题占一行，来源与时间占一行。</p>

  <div class="stage" id="stage">
    <div class="device" id="dev">
      <div class="bar">
        <span>RSS 头条</span>
        <span><span class="pg" id="pg">1/1</span>&nbsp;&nbsp;<span id="clock">--:--</span></span>
      </div>
      <div class="list" id="list">
        <div class="it"><div class="t">正在载入…</div><div class="m"><i>feed-screen.xml</i></div></div>
      </div>
    </div>
  </div>

  <div class="ctrl">
    <button id="prev">‹ 上页</button>
    <span class="num" id="pg2">1 / 1</span>
    <button id="next">下页 ›</button>
    <button id="play">暂停轮播</button>
    <button id="zoom">放大 2×</button>
  </div>

  <div class="specs">
    屏幕 296 × 152 px · 2.66 英寸 · 125 PPI · 黑白双色<br>
    标题已在上游裁到 22 个全角字符内（<code>SCREEN_TITLE_WIDTH</code>），
    一屏 4 条、共 <code>SCREEN_ITEMS</code> 条
  </div>

  <div class="foot">
    <a href="./feed-screen.xml">feed-screen.xml</a> ·
    <a href="./">订阅说明</a> ·
    <a href="https://github.com/cheney-hub/rss-hub">源码仓库</a>
  </div>
</div>

<script>
const PER_PAGE = 4, AUTO_MS = 12000;
let items = [], page = 0, pages = 1, timer = null, playing = true;

const $ = id => document.getElementById(id);

function ago(d){
  if(!d || isNaN(d)) return '';
  const min = Math.round((Date.now() - d.getTime()) / 60000);
  if(min < 1) return '刚刚';
  if(min < 60) return min + ' 分钟前';
  if(min < 1440) return Math.round(min / 60) + ' 小时前';
  return (d.getMonth()+1) + '/' + d.getDate();
}

function tick(){
  const n = new Date();
  $('clock').textContent = String(n.getHours()).padStart(2,'0') + ':' +
                           String(n.getMinutes()).padStart(2,'0');
}

function render(){
  const slice = items.slice(page * PER_PAGE, page * PER_PAGE + PER_PAGE);
  $('list').innerHTML = slice.map(it => {
    const meta = [it.src, ago(it.date)].filter(Boolean).join(' · ');
    return '<div class="it"><div class="t">' + it.title + '</div>' +
           '<div class="m"><i>' + meta + '</i></div></div>';
  }).join('') || '<div class="it"><div class="t">暂无条目</div></div>';
  const txt = (page + 1) + '/' + pages;
  $('pg').textContent = txt;
  $('pg2').textContent = txt.replace('/', ' / ');
}

function go(delta){
  if(pages < 2) return;
  page = (page + delta + pages) % pages;
  render();
}

function startAuto(){
  stopAuto();
  if(!playing) return;
  timer = setInterval(() => go(1), AUTO_MS);
}
function stopAuto(){ if(timer){ clearInterval(timer); timer = null; } }

function esc(s){
  return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
}

function load(url){
  return fetch(url + '?t=' + Date.now(), {cache:'no-store'})
    .then(r => { if(!r.ok) throw new Error(r.status); return r.text(); });
}

// 优先用裁好的墨水屏版；没有就退回完整版（靠 CSS 省略号兜住）
load('./feed-screen.xml').catch(() => load('./feed.xml'))
  .then(txt => {
    const doc = new DOMParser().parseFromString(txt, 'text/xml');
    items = [...doc.querySelectorAll('item')].map(it => {
      const d = it.querySelector('pubDate')?.textContent;
      const date = d ? new Date(d) : null;
      return {
        title: esc(it.querySelector('title')?.textContent?.trim() || '(无标题)'),
        src:   esc(it.querySelector('source')?.textContent?.trim() || ''),
        date:  date && !isNaN(date) ? date : null
      };
    });
    pages = Math.max(1, Math.ceil(items.length / PER_PAGE));
    page = 0;
    render();
    startAuto();
  })
  .catch(e => {
    $('list').innerHTML = '<div class="it"><div class="t">载入失败</div>' +
                          '<div class="m"><i>' + esc(e.message) + '</i></div></div>';
  });

$('prev').onclick = () => { go(-1); startAuto(); };
$('next').onclick = () => { go(1);  startAuto(); };
$('dev').onclick  = () => { go(1);  startAuto(); };
$('zoom').onclick = () => {
  const on = $('stage').classList.toggle('z2');
  $('zoom').textContent = on ? '还原 1×' : '放大 2×';
};
$('play').onclick = () => {
  playing = !playing;
  $('play').textContent = playing ? '暂停轮播' : '继续轮播';
  playing ? startAuto() : stopAuto();
};

tick();
setInterval(tick, 20000);
</script>
</body>
</html>
