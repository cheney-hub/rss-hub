<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>小屏效果示意 · RSS 聚合头条</title>
<style>
  :root{
    --bg:#f2f3f5; --fg:#1b1f24; --sub:#5f6b7a; --card:#fff;
    --line:#dcdfe4; --btn:#1b1f24; --btn-fg:#fff;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#0f1216; --fg:#e8eaed; --sub:#9aa4b2; --card:#171b21;
           --line:#262c35; --btn:#e8eaed; --btn-fg:#12161b; }
  }
  *{box-sizing:border-box}
  body{margin:0;padding:28px 16px 56px;background:var(--bg);color:var(--fg);
       font:15px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
  .wrap{max-width:560px;margin:0 auto}
  h1{font-size:22px;margin:0 0 4px}
  .sub{color:var(--sub);font-size:13px;margin:0 0 26px}
  .stage{display:flex;justify-content:center;height:180px}
  .stage.z2{height:340px}

  /* ---- 设备尺寸按 296×152 写死；内容样式只是「Dot 摘录」风格的示意，
         真实渲染由 Dot 云端模板决定，以设备实际显示为准 ---- */
  .device{width:296px;height:152px;padding:12px 14px;background:#fff;color:#000;
          border-radius:7px;overflow:hidden;display:flex;flex-direction:column;justify-content:center;
          box-shadow:0 0 0 1px #b9bec6, 0 12px 30px rgba(0,0,0,.20);
          transform-origin:center top;cursor:pointer;user-select:none;
          font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
  .stage.z2 .device{transform:scale(2)}
  .q{font-size:14px;line-height:1.45;font-weight:600;display:-webkit-box;
     -webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
  .m{font-size:9px;margin-top:10px;opacity:.55;white-space:nowrap;overflow:hidden;
     text-overflow:ellipsis}

  .ctrl{display:flex;gap:8px;justify-content:center;align-items:center;
        margin:6px 0 4px;flex-wrap:wrap}
  .ctrl button{border:1px solid var(--line);background:var(--card);color:var(--fg);
               border-radius:9px;padding:7px 13px;font-size:13px;cursor:pointer}
  .ctrl button:active{opacity:.8}
  .ctrl .num{color:var(--sub);font-size:13px;min-width:52px;text-align:center}
  .note{color:var(--sub);font-size:12px;text-align:center;margin-top:14px;line-height:1.9}
  .specs{color:var(--sub);font-size:12px;text-align:center;margin-top:6px;line-height:1.9}
  .specs code{font-size:11px}
  .foot{color:var(--sub);font-size:12px;text-align:center;margin-top:22px}
  .foot a{color:var(--sub)}
</style>
</head>
<body>
<div class="wrap">
  <h1>小屏效果示意</h1>
  <p class="sub">Dot Quote/0 的显示由 Dot 云端渲染，本页只示意「一次一条」的内容效果，实际样式以设备为准。</p>

  <div class="stage" id="stage">
    <div class="device" onclick="toggleZoom()" title="点击放大 / 缩小">
      <div class="q" id="q">—</div>
      <div class="m" id="m">—</div>
    </div>
  </div>

  <div class="ctrl">
    <button onclick="step(-1)">‹ 上一条</button>
    <span class="num" id="num">1 / 1</span>
    <button onclick="step(1)">下一条 ›</button>
    <button id="play" onclick="togglePlay()">暂停轮播</button>
    <button id="zoom" onclick="toggleZoom()">放大 2×</button>
  </div>

  <div class="note">
    设备刷新间隔在 Dot App 里设置（1 分钟 ～ 12 小时，电池模式睡眠期间不刷新）；<br>
    Dot 云端多久抓一次本源由 Dot 侧调度，订阅方无法控制，但本源每分钟都是新鲜的。
  </div>

  <div class="specs">
    订阅源：本站 <code>feed-screen.xml</code> —— 纯文本标题（emoji / 装饰符号已摘除）、<br>
    标题在标点处优雅截断（<code>SCREEN_TITLE_WIDTH</code>，默认 24 全角）、条目给足 60 条、字段极简
  </div>

  <div class="foot">
    <a href="./feed-screen.xml">feed-screen.xml</a> ·
    <a href="./">订阅说明</a> ·
    <a href="https://github.com/cheney-hub/rss-hub">源码仓库</a>
  </div>
</div>

<script>
let items = [], idx = 0, timer = null, zoomed = false, playing = true;

const $ = id => document.getElementById(id);

function ago(s){
  if(!s) return '';
  const d = new Date(s);
  if(isNaN(d)) return '';
  const min = Math.round((Date.now() - d.getTime()) / 60000);
  if(min < 1) return '刚刚';
  if(min < 60) return min + ' 分钟前';
  if(min < 1440) return Math.round(min / 60) + ' 小时前';
  return (d.getMonth()+1) + '月' + d.getDate() + '日';
}

function render(){
  if (!items.length) return;
  const it = items[idx % items.length];
  $('q').textContent = it.title;
  const when = ago(it.date);
  $('m').textContent = [it.src, when].filter(Boolean).join(' · ');
  $('num').textContent = (idx % items.length + 1) + ' / ' + items.length;
}

function step(d){ idx += d; render(); restart(); }
function restart(){
  if (timer) clearInterval(timer);
  if (playing) timer = setInterval(() => { idx++; render(); }, 8000);
}
function togglePlay(){
  playing = !playing;
  $('play').textContent = playing ? '暂停轮播' : '继续轮播';
  restart();
}
function toggleZoom(){
  zoomed = !zoomed;
  $('stage').className = zoomed ? 'stage z2' : 'stage';
  $('zoom').textContent = zoomed ? '缩小' : '放大 2×';
}

fetch('./feed-screen.xml', {cache:'no-store'})
  .then(r => r.text())
  .then(t => {
    const doc = new DOMParser().parseFromString(t, 'text/xml');
    items = [...doc.querySelectorAll('item')].map(it => ({
      title: (it.querySelector('title')||{}).textContent || '',
      src:   (it.querySelector('source')||{}).textContent || '',
      date:  (it.querySelector('pubDate')||{}).textContent || ''
    }));
    render(); restart();
  })
  .catch(() => { $('q').textContent = '无法加载 feed-screen.xml'; });
</script>
</body>
</html>
