# 树莓派 SSH 加固（drop-in，由 /etc/ssh/sshd_config 的 Include 引入）
# 主配置不改动，改这里即可；撤销只需删除本文件再 reload。

# 只用密钥登录：这是最关键的一条。开启时 6 位弱密码可被秒破，
# 关掉后再强的字典也无从下手。
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitEmptyPasswords no
PubkeyAuthentication yes

# 只允许 user 这个账号登录（防其它系统账号被拿来试）
AllowUsers user

# 禁止 root 直接登录
PermitRootLogin no

# 关掉用不到的转发，缩小被利用的面
X11Forwarding no
AllowAgentForwarding no
AllowTcpForwarding no

# 减少暴力尝试的窗口
MaxAuthTries 3
LoginGraceTime 30
