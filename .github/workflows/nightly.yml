name: RSS 夜间整点发布

# 北京时间 00:00–06:00（UTC 16:00–21:59）降为每小时一次。
# 白天的高频由 minute.yml 负责，两者按 UTC 小时互斥，不重叠：
#   minute.yml   UTC 22,23,0-15  → 北京 06:00–23:59
#   nightly.yml  UTC 16-21       → 北京 00:00–05:59
# 深夜新闻源更新稀少，没必要每分钟抓一轮，省 runner 时间也少打扰源站。

on:
  schedule:
    - cron: "7 16-21 * * *"
  workflow_dispatch:

concurrency:
  # 与 minute.yml 同一个组：Pages 同一时刻只允许一个部署，
  # 撞上时排队而不是报 "in progress deployment"。两个工作流时段互补，正常不会排队。
  group: rss-pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 抓取并生成 feed（夜间单轮）
        env:
          REFRESH_SECONDS: "0"
          FEED_URL: "https://cheney-hub.github.io/rss-hub/feed.xml"
          CONCURRENCY: "12"
          FETCH_TIMEOUT: "20"
          SCREEN_TITLE_WIDTH: "13"
          SCREEN_ITEMS: "60"
        run: python build_feed.py

      - uses: actions/upload-pages-artifact@v3
        with:
          name: site-nightly
          path: docs
          retention-days: 1

      - id: deploy
        uses: actions/deploy-pages@v4
        with:
          artifact_name: site-nightly
