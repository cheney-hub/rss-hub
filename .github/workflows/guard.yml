name: 凭据扫描

# 每次推送都检查仓库里有没有混进 token / 口令 / 私钥；
# 只改 feed.xml 的自动提交不触发，避免刷运行记录。
on:
  push:
    paths-ignore:
      - "docs/feed.xml"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 扫描凭据
        run: python3 tools/check_secrets.py
