name: RSS 聚合（改源即时发布）

# 日常更新的唯一节拍在这里：北京时间每天 08:00 / 13:00 / 18:00 各发一版
# （GitHub cron 用 UTC，即 00/05/10 点）。minute.yml 与 nightly.yml 的 schedule 都已停用，
# 要临时高频时手动 dispatch 那两份。
# 另外 feeds.txt / 引擎代码被改动时立刻重建发布一次，免得等下一个整点。

on:
  schedule:
    # 北京时间 08:00 / 13:00 / 18:00 各更新一次（GitHub cron 用 UTC → 0,5,10）
    - cron: "0 0,5,10 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "feeds.txt"
      - "build_feed.py"
      - "render.py"          # 改排版规则也要立刻重建，否则要等下一个整点
      - "rotate.py"          # 改轮播规则同理：不重建就还是旧规则在发设备版
      - "version.py"
      - ".github/workflows/rss.yml"

concurrency:
  # 这个 group 只防「自己和自己」重叠（手动 dispatch 连点、push 与 schedule 撞一起）。
  # 和 minute.yml / nightly.yml 不是同一个 group，抢不到它们；Pages 同一时刻只允许
  # 一个部署，那件事靠下面「等 Pages 空档 + 重新部署」两步兜。
  group: rss-oneshot
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 抓取并生成 feed（单轮）
        # 参数必须与 nightly.yml / minute.yml 那两份逐字一致：少写一项就会静默落回
        # 代码默认值，出现「这一版排版跟平时不一样」的怪现象（历史上 SCREEN_BODY_MAX 写错过）。
        # 唯一的例外是 SCREEN_OUT / ROTATE_STATE：那两项三份都指向各自的 runner 临时目录。
        env:
          REFRESH_SECONDS: "0"
          FEED_URL: "https://cheney-hub.github.io/rss-hub/feed.xml"
          CONCURRENCY: "12"
          FETCH_TIMEOUT: "20"
          SCREEN_LINE_WIDTH: "13"
          SCREEN_BODY_MAX: "90"
          FEED_BODY_MAX: "0"
          PER_SOURCE: "5"
          ITEM_LIMIT: "120"
          ROTATE_SECONDS: "300"
          ROTATE_POOL_MAX: "120"
          # 游标也丢到 runner 临时目录：设备版已不在 GitHub 侧发布，docs/rotate.json
          # 没有任何读者，没必要每轮多传一个文件上 Pages（Pi 有自己的游标）。
          ROTATE_STATE: "${{ runner.temp }}/rotate.json"
          # 设备版只在树莓派上发（moreaix.com/rss/feed-wrap.xml）。GitHub 这份只供阅读器
          # 订阅完整版 feed.xml，所以把设备版输出丢到 runner 临时目录，不进 docs/、不发布。
          SCREEN_OUT: "${{ runner.temp }}/feed-wrap.xml"
        run: python build_feed.py

      - uses: actions/upload-pages-artifact@v3
        with:
          name: site-oneshot
          path: docs
          retention-days: 1

      - id: deploy
        uses: actions/deploy-pages@v4
        with:
          artifact_name: site-oneshot
        continue-on-error: true

      # Pages 同一时刻只允许一个部署。若正好撞上 minute.yml 的轮次会报 in progress，
      # 这里等一轮再试，避免改个源就红一次。
      - name: 等 Pages 空档
        if: steps.deploy.outcome == 'failure'
        run: sleep 35

      - uses: actions/upload-pages-artifact@v3
        if: steps.deploy.outcome == 'failure'
        with:
          name: site-oneshot-retry
          path: docs
          retention-days: 1

      - name: 重新部署
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v4
        with:
          artifact_name: site-oneshot-retry
