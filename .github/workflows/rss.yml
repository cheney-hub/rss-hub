name: RSS 聚合（改源即时发布）

# 日常节奏由 minute.yml 负责（每小时连续跑 13 轮，每轮 5 分钟）。
# 本工作流只处理一类场景：feeds.txt / build_feed.py 被改动后，立刻重建并发布一次，
# 免得等下一个整点。不做定时任务，避免和 minute.yml 抢 Pages 部署。

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "feeds.txt"
      - "build_feed.py"
      - ".github/workflows/rss.yml"

concurrency:
  group: rss-oneshot
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 抓取并生成 feed（单轮）
        env:
          REFRESH_SECONDS: "0"
          FEED_URL: "https://cheney-hub.github.io/rss-hub/feed.xml"
          CONCURRENCY: "12"
          FETCH_TIMEOUT: "20"
          SCREEN_LINE_WIDTH: "13"
          SCREEN_BODY_MAX: "60"
          ROTATE_SECONDS: "300"
        run: python build_feed.py

      - uses: actions/upload-pages-artifact@v3
        with:
          name: site-oneshot
          path: docs
          retention-days: 1

      - id: deploy
        uses: actions/deploy-pages@v4
        with:
          artifact_name: site-oneshot
        continue-on-error: true

      # Pages 同一时刻只允许一个部署。若正好撞上 minute.yml 的轮次会报 in progress，
      # 这里等一轮再试，避免改个源就红一次。
      - name: 等 Pages 空档
        if: steps.deploy.outcome == 'failure'
        run: sleep 35

      - uses: actions/upload-pages-artifact@v3
        if: steps.deploy.outcome == 'failure'
        with:
          name: site-oneshot-retry
          path: docs
          retention-days: 1

      - name: 重新部署
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v4
        with:
          artifact_name: site-oneshot-retry
