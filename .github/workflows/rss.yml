name: RSS 聚合（改源即时发布）

# 日常更新的唯一节拍在这里：北京时间每天 08:00 / 13:00 / 18:00 各发一版
# （GitHub cron 用 UTC，即 00/05/10 点）。minute.yml 与 nightly.yml 的 schedule 都已停用，
# 要临时高频时手动 dispatch 那两份。
# 另外 feeds.txt / 引擎代码 / docs 静态页被改动时立刻重建发布一次，免得等下一个整点。
# 静态页也列进 paths：Pages 发的是整个 docs/ 目录，只改 HTML 却不触发构建的话，
# 新页面一直躺在 git 里、线上还是旧文案（2026-11-06 校正首页说明时发现）。

on:
  schedule:
    # 北京时间 08:00 / 13:00 / 18:00 各更新一次（GitHub cron 用 UTC → 0,5,10）
    - cron: "0 0,5,10 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "feeds.txt"
      - "build_feed.py"
      - "feeds_sync.py"       # 清单同步跑在构建第一步（读取清单之前），改了它也要立刻重建
      - "render.py"           # 改排版规则也要立刻重建，否则要等下一个整点
      - "rotate.py"          # 改轮播规则同理：不重建就还是旧规则在发设备版
      - "version.py"
      # 静态页用通配一次覆盖全部（含主推的 reader.html）：以前逐文件列，
      # 11-20 给 reader 做 SEO 时就漏了它，单推那一页不会触发 Pages 重建。
      - "docs/*.html"
      - "docs/sitemap.xml"    # SEO：站点地图也要重新部署 Pages
      - "docs/robots.txt"     # SEO：爬虫规则也要重新部署 Pages
      - ".github/workflows/rss.yml"

concurrency:
  # 这个 group 只防「自己和自己」重叠（手动 dispatch 连点、push 与 schedule 撞一起）。
  # 和 minute.yml / nightly.yml 不是同一个 group，抢不到它们；Pages 同一时刻只允许
  # 一个部署，那件事靠下面 deploy 的递增间隔重试（5/20/60s）兜。
  group: rss-oneshot
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 抓取并生成 feed（单轮）
        # 参数必须与 nightly.yml / minute.yml 那两份逐字一致：少写一项就会静默落回
        # 代码默认值，出现「这一版排版跟平时不一样」的怪现象（历史上 SCREEN_BODY_MAX 写错过）。
        # 唯一的例外是 SCREEN_OUT / ROTATE_STATE：那两项三份都指向各自的 runner 临时目录。
        env:
          REFRESH_SECONDS: "0"
          FEED_URL: "https://cheney-hub.github.io/rss-hub/feed.xml"
          CONCURRENCY: "12"
          FETCH_TIMEOUT: "20"
          SCREEN_LINE_WIDTH: "13"
          SCREEN_BODY_MAX: "90"
          FEED_BODY_MAX: "0"
          PER_SOURCE: "5"
          ITEM_LIMIT: "120"
          ROTATE_SECONDS: "300"
          ROTATE_POOL_MAX: "120"
          # 游标也丢到 runner 临时目录：设备版已不在 GitHub 侧发布，docs/rotate.json
          # 没有任何读者，没必要每轮多传一个文件上 Pages（Pi 有自己的游标）。
          ROTATE_STATE: "${{ runner.temp }}/rotate.json"
          # 设备版只在树莓派上发（moreaix.com/rss/feed-wrap.xml）。GitHub 这份只供阅读器
          # 订阅完整版 feed.xml，所以把设备版输出丢到 runner 临时目录，不进 docs/、不发布。
          SCREEN_OUT: "${{ runner.temp }}/feed-wrap.xml"
        run: python build_feed.py

      - uses: actions/upload-pages-artifact@v3
        with:
          name: site-oneshot
          path: docs
          retention-days: 1

      # deploy-pages 有个已知 bug（actions/deploy-pages#451）：artifact 上传后元数据
      # 在 API 里还没可见，紧接着部署会报 "No artifacts named ... were found" /
      # "Fetching artifact metadata failed"（11-24、11-25 各红一次就是这个）。
      # 对策：只重试 deploy，绝不重新上传——重复上传的 artifact 反而查不到（原逻辑
      # 用新名字 site-oneshot-retry 再传一次，第二次部署照样失败）。间隔 5/20/60s
      # 递增，兼顾 GitHub 侧元数据传播和 Pages 并发部署 in progress 的短暂空档。
      # 最后一次重试不设 continue-on-error：三次都失败要让 job 变红，运维能发现。
      - id: deploy
        uses: actions/deploy-pages@v4
        with:
          artifact_name: site-oneshot
        continue-on-error: true

      - name: 等 5 秒重试部署
        if: steps.deploy.outcome == 'failure'
        run: sleep 5
      - id: deploy_retry_1
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v4
        with:
          artifact_name: site-oneshot
        continue-on-error: true

      - name: 等 20 秒重试部署
        if: steps.deploy_retry_1.outcome == 'failure'
        run: sleep 20
      - id: deploy_retry_2
        if: steps.deploy_retry_1.outcome == 'failure'
        uses: actions/deploy-pages@v4
        with:
          artifact_name: site-oneshot
        continue-on-error: true

      - name: 等 60 秒最后重试部署
        if: steps.deploy_retry_2.outcome == 'failure'
        run: sleep 60
      - name: 最后重试部署（失败则报红）
        if: steps.deploy_retry_2.outcome == 'failure'
        uses: actions/deploy-pages@v4
        with:
          artifact_name: site-oneshot
